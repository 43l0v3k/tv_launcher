name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APKs
        run: gradle assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/svoe-tv.apk
          cp phone/build/outputs/apk/debug/*.apk dist/svoe-phone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: svoe-apks
          path: dist/*.apk

      # Постоянная ссылка на свежие APK: Releases -> «Последняя сборка»
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          body_path: RELEASE_NOTES.md
          files: dist/*.apk
          make_latest: true
