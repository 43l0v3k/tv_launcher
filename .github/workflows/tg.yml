name: Post to Telegram

# Ручной запуск: публикует файл из tg_posts/ в канал.
# Секреты репозитория: TG_TOKEN (токен бота) и TG_CHAT (@канал или id).
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Имя файла в tg_posts/ (HTML-разметка Telegram)"
        required: true

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          [[ "$FILE" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad file name"; exit 1; }
          test -f "tg_posts/$FILE"
          curl -sS --fail-with-body "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" -d parse_mode=HTML \
            --data-urlencode text@"tg_posts/$FILE" > resp.json || { cat resp.json; exit 1; }
          grep -q '"ok":true' resp.json && echo "sent"
